name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Image version to deploy (e.g. 1.4.0). Leave empty to auto-resolve the version built by CI.'
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve image version
        id: ver
        run: |
          if [ -n "${{ inputs.image_version }}" ]; then
            echo "version=${{ inputs.image_version }}" >> "$GITHUB_OUTPUT"
          elif TAG=$(git describe --tags --exact-match 2>/dev/null); then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to resolve an image version" >&2
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Create Docker network
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker network create mycv-net 2>/dev/null || true"

      - name: Log in to GHCR on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin"

  deploy-api:
    name: Deploy API
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Fetch CV document from share link
        env:
          CV_SHARE_URL: ${{ secrets.CV_SHARE_URL }}
          CV_SHARE_PASSWORD: ${{ secrets.CV_SHARE_PASSWORD }}
        run: |
          ENV_B64=$(printf '%s\n' "$CV_SHARE_URL" "$CV_SHARE_PASSWORD" | base64 -w0)
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "export CV_FETCH_ENV_B64='$ENV_B64'; bash -s" <<'EOF'
          set -euo pipefail
          SHARE_URL=''; SHARE_PW=''
          { IFS= read -r SHARE_URL; IFS= read -r SHARE_PW; } < <(printf '%s' "$CV_FETCH_ENV_B64" | base64 -d)
          if [ -z "$SHARE_URL" ] || [ -z "$SHARE_PW" ]; then
            echo "CV_SHARE_URL / CV_SHARE_PASSWORD secrets are missing or empty" >&2
            exit 1
          fi
          BASE=${SHARE_URL%%\?*}
          SSID=$(printf '%s' "$SHARE_URL" | sed -n 's/.*ssid=\([0-9a-fA-F]*\).*/\1/p')
          if [ -z "$SSID" ]; then
            echo "CV_SHARE_URL does not contain an ssid parameter" >&2
            exit 1
          fi
          EP=$(printf '%s' "$SHARE_PW" | base64 -w0)
          TMP=/opt/mycv/data/cv.docx.tmp
          rm -f "$TMP"
          trap 'rm -f "$TMP"' EXIT
          CHECK=$(curl -fsSG --data-urlencode "ssid=$SSID" --data-urlencode "func=check_passwd" --data-urlencode "ep=$EP" "$BASE")
          if ! printf '%s' "$CHECK" | grep -qE '"status": *1([^0-9]|$)'; then
            echo "Share link password check failed" >&2
            exit 1
          fi
          curl -fsSG -o "$TMP" --data-urlencode "ssid=$SSID" --data-urlencode "openfolder=normal" --data-urlencode "ep=$EP" --data-urlencode "fid=$SSID" --data-urlencode "_dc=$(date +%s%3N)" "$BASE"
          SIZE=$(wc -c < "$TMP" | tr -d ' ')
          if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt 5242880 ]; then
            echo "Invalid CV size: $SIZE" >&2
            exit 1
          fi
          if [ "$(od -An -tx1 -N4 "$TMP" | tr -d ' \n')" != "504b0304" ]; then
            echo "CV is not an Office document" >&2
            exit 1
          fi
          if ! grep -aq 'word/document.xml' "$TMP"; then
            echo "CV is not a valid .docx" >&2
            exit 1
          fi
          mv -f "$TMP" /opt/mycv/data/cv.docx
          echo "CV updated: $SIZE bytes"
          EOF

      - name: Pull and restart API
        env:
          IMAGE: ghcr.io/s3rbr0p4r/mycv/mycv-api
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker network inspect npm_network >/dev/null && \
             docker pull $IMAGE:$VERSION && \
             (docker rm -f mycv-api || true) && \
             docker run -d --name mycv-api --restart unless-stopped \
               --network mycv-net --network-alias mycv-api \
               --ip ${{ secrets.API_CONTAINER_IP }} \
               -p ${{ vars.BACKEND_PORT }}:${{ vars.BACKEND_PORT }} \
               -v /opt/mycv/data:/app/Infrastructure/Data \
               -e CvSource__FilePath=Infrastructure/Data/cv.docx \
               -e CvSource__AllowedDirectory=Infrastructure/Data \
               -e SocialLinks__LinkedIn=${{ vars.SOCIAL_LINKS_LINKEDIN }} \
               -e SocialLinks__GitHub=${{ vars.SOCIAL_LINKS_GITHUB }} \
               -e AllowedHosts=* \
               -e Cors__FrontendUrl=${{ vars.FRONTEND_URL }} \
               -e Discord__ErrorWebhookUrl=${{ secrets.DISCORD_ERROR_WEBHOOK_URL }} \
               -e Discord__FeedbackWebhookUrl=${{ secrets.DISCORD_FEEDBACK_WEBHOOK_URL }} \
               -e DeepL__AuthKey=${{ secrets.DEEPL_AUTH_KEY }} \
               -e DeepL__TimeoutSeconds=${{ vars.DEEPL_TIMEOUT_SECONDS }} \
               -l "wud.watch=false" \
               $IMAGE:$VERSION && \
             docker network connect --ip ${{ secrets.API_CONTAINER_NETWORK_LINK_IP }} npm_network mycv-api"

  health-check:
    name: Health check
    needs: [deploy-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Wait and verify API health
        run: |
          sleep 5
          for attempt in 1 2 3 4 5; do
            CODE=$(ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              'curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ vars.BACKEND_PORT }}/health || true')
            if [ "$CODE" = "200" ]; then
              echo "API healthy (HTTP 200) on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE"
            sleep 3
          done
          echo "API health check failed after 5 attempts, last response body:" >&2
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'curl -sS http://127.0.0.1:${{ vars.BACKEND_PORT }}/health' >&2 || true
          exit 1

  deploy-frontend:
    name: Deploy Frontend
    needs: [prepare, health-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart frontend
        env:
          IMAGE: ghcr.io/s3rbr0p4r/mycv/mycv-frontend
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker network inspect npm_network >/dev/null && \
             docker pull $IMAGE:$VERSION && \
             (docker rm -f mycv-frontend || true) && \
             docker run -d --name mycv-frontend --restart unless-stopped \
               --network mycv-net \
               --ip ${{ secrets.FRONTEND_CONTAINER_IP }} \
               -p ${{ vars.FRONTEND_PORT }}:${{ vars.FRONTEND_PORT }} \
               -e PORT=${{ vars.FRONTEND_PORT }} \
               -e FRONTEND_URL=${{ vars.FRONTEND_URL }} \
               -e BACKEND_PORT=${{ vars.BACKEND_PORT }} \
               -l "wud.watch=false" \
               $IMAGE:$VERSION && \
             docker network connect --ip ${{ secrets.FRONTEND_CONTAINER_NETWORK_LINK_IP }} npm_network mycv-frontend"

  health-check-frontend:
    name: Frontend health check
    needs: [deploy-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Verify frontend serves requests
        run: |
          sleep 5
          for attempt in 1 2 3 4 5; do
            CODES=$(ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              'echo "$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ vars.FRONTEND_PORT }}/ || true) $(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:${{ vars.FRONTEND_PORT }}/api/v1/cv || true)"')
            if [ "$CODES" = "200 200" ]; then
              echo "Frontend OK on attempt $attempt (/, /api/v1/cv = 200)"
              exit 0
            fi
            echo "Attempt $attempt: $CODES"
            sleep 3
          done
          echo "Frontend health check failed after 5 attempts" >&2
          exit 1
