name: CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Ensure Docker network
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker network create mycv-net 2>/dev/null || true"

      - name: Pull and restart
        env:
          IMAGE: ghcr.io/s3rbr0p4r/mycv/mycv-api
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             docker pull $IMAGE && \
             docker rm -f mycv-api || true && \
             docker run -d --name mycv-api --restart unless-stopped \
               --network mycv-net --network-alias mycv-api \
               -p ${{ vars.BACKEND_PORT }}:${{ vars.BACKEND_PORT }} \
               -v /opt/mycv/data:/app/Infrastructure/Data \
               -e CvSource__FilePath=Infrastructure/Data/cv.docx \
               -e CvSource__AllowedDirectory=Infrastructure/Data \
               -e SocialLinks__LinkedIn=${{ vars.SOCIAL_LINKS_LINKEDIN }} \
               -e SocialLinks__GitHub=${{ vars.SOCIAL_LINKS_GITHUB }} \
               -e AllowedHosts=* \
               -e Cors__FrontendUrl=${{ vars.FRONTEND_URL }} \
               -e Discord__WebhookUrl=${{ secrets.DISCORD_WEBHOOK_URL }} \
               -e DeepL__AuthKey=${{ secrets.DEEPL_AUTH_KEY }} \
               $IMAGE && \
             docker logout ghcr.io"

      - name: Health check
        run: |
          sleep 5
          curl --retry 5 --retry-delay 3 --retry-connrefused \
            --output /dev/null --write-out "%{http_code}" \
            https://${{ secrets.API_HOST }}/health

      - name: Pull and restart frontend
        env:
          IMAGE: ghcr.io/s3rbr0p4r/mycv/mycv-frontend
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             docker pull $IMAGE && \
             docker rm -f mycv-frontend || true && \
             docker run -d --name mycv-frontend --restart unless-stopped \
               --network mycv-net \
               -p ${{ vars.FRONTEND_PORT }}:${{ vars.FRONTEND_PORT }} \
               -e PORT=${{ vars.FRONTEND_PORT }} \
               -e FRONTEND_URL=${{ vars.FRONTEND_URL }} \
               -e BACKEND_PORT=${{ vars.BACKEND_PORT }} \
               $IMAGE && \
             docker logout ghcr.io"
