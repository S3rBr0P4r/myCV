name: CD

on:
  workflow_dispatch:
    inputs:
      server_password:
        description: 'Server SSH password'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - run: echo "::add-mask::${{ github.event.inputs.server_password }}"
      - name: Pull and restart on server
        env:
          SSHPASS: ${{ github.event.inputs.server_password }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /opt/mycv && docker compose pull && docker compose up -d"
      - name: Health check
        run: |
          sleep 5
          curl --retry 5 --retry-delay 3 --retry-connrefused \
            https://${{ vars.API_HOST }}/api/v1/cv
