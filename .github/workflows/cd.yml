name: CD

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart
        env:
          IMAGE: ghcr.io/${{ github.repository }}/mycv-api
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMG="${IMAGE,,}"
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             docker pull $IMG && \
             docker stop mycv-api || true && \
             docker rm mycv-api || true && \
             docker run -d --name mycv-api --restart unless-stopped \
               -p 60355:60355 \
               -v /opt/mycv/data:/app/Infrastructure/Data \
               -e CvSource__FilePath=Infrastructure/Data/cv.docx \
               -e CvSource__AllowedDirectory=Infrastructure/Data \
               -e SocialLinks__LinkedIn=${{ vars.SOCIAL_LINKS_LINKEDIN }} \
               -e SocialLinks__GitHub=${{ vars.SOCIAL_LINKS_GITHUB }} \
               -e AllowedHosts=* \
               -e Cors__FrontendUrl=${{ vars.FRONTEND_URL }} \
               -e Discord__WebhookUrl=${{ secrets.DISCORD_WEBHOOK_URL }} \
               -e DeepL__AuthKey=${{ secrets.DEEPL_AUTH_KEY }} \
               $IMG && \
             docker logout ghcr.io"

      - name: Health check
        run: |
          sleep 5
          curl --retry 5 --retry-delay 3 --retry-connrefused \
            --output /dev/null --write-out "%{http_code}" \
            https://${{ secrets.API_HOST }}/health

      - name: Build and deploy frontend
        run: |
          cd frontend
          npm ci
          npm run build
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }}" \
            dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/mycv/frontend/
