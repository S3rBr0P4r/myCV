name: Continuous Integration

on:
  push:
    branches:
      - 'main'
      
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    name: FrontEnd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            .github
            src
      - name: Use Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
        working-directory: ./src/frontEnd
      - name: Build
        run: npm run build
        working-directory: ./src/frontEnd
      - name: Enter password to connect through SSH
        uses: step-security/wait-for-secrets@v1
        id: wait-for-secrets
        with:
          secrets: |
            PASSWORD: 
              name: 'Password to connect through SSH'
              description: 'Necessary password to connect through SSH'
      - name: Stop website
        uses: appleboy/ssh-action@master
        with:
          script: |
            ls /opt/
            echo "Website is being stopped..."
            echo ${{ steps.wait-for-secrets.outputs.PASSWORD }} | sudo -S service myCV stop
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ steps.wait-for-secrets.outputs.PASSWORD }}
