name: Continuous Integration

on:
  push:
    branches:
      - 'main'
      
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    name: FrontEnd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            .github
            src
      - name: Use Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
        working-directory: ./src/frontEnd
      - name: Build
        run: npm run build
        working-directory: ./src/frontEnd
      - name: Install SSH keys
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key
          cat >>~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
      - name: Enter password to connect through SSH
        uses: step-security/wait-for-secrets@v1
        id: wait-for-secrets
        with:
          secrets: |
            PASSWORD: 
              name: 'Password to connect through SSH'
              description: 'Necessary password to connect through SSH'
      - name: SSH test
        run: ssh staging 'whoami'
