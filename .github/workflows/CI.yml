name: Continuous Integration

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: FrontEnd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            .github
            src
      - name: Use Node 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
        working-directory: ./src/frontEnd
      - name: Build
        run: npm run build
        working-directory: ./src/frontEnd
