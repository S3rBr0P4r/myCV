name: Continuous Integration

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: Build FrontEnd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Use Node 20.x
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
