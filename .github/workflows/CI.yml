name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_CSP_SCRIPT_SRC: ${{ vars.VITE_CSP_SCRIPT_SRC }}
      VITE_CSP_STYLE_SRC: ${{ vars.VITE_CSP_STYLE_SRC }}
      VITE_CSP_CONNECT_SRC: ${{ vars.VITE_CSP_CONNECT_SRC }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - run: npm run build
        working-directory: ./frontend
      - run: npm run test
        working-directory: ./frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: './backend/global.json'
          cache: true
          cache-dependency-path: 'backend/Directory.Packages.props'
      - run: dotnet restore Backend.slnx
        working-directory: ./backend
      - run: dotnet build Backend.slnx --no-restore --configuration Release
        working-directory: ./backend
      - run: dotnet test Backend.slnx --no-build --configuration Release
        working-directory: ./backend

  docker:
    name: Docker
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/mycv-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
