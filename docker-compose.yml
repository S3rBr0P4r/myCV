services:
  mycv-api:
    image: ghcr.io/<owner>/<repo>/mycv-api:latest
    restart: unless-stopped
    ports:
      - "60355:60355"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedHosts=${ALLOWED_HOSTS}
      - CvSource__FilePath=/data/cv.docx
      - DeepL__AuthKey=${DEEPL_AUTH_KEY}
      - DeepL__CacheDurationMinutes=1440
      - Discord__WebhookUrl=${DISCORD_WEBHOOK_URL}
      - Cors__FrontendUrl=${CORS_FRONTEND_URL}
    volumes:
      - /path/to/cv.docx:/data/cv.docx:ro
